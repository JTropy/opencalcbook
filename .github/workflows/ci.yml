name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 内核：运行时零依赖。刻意不执行 npm install，
  # 以此证明 src/ 下的代码不依赖任何第三方包（也顺便跑得更快）。
  # ─────────────────────────────────────────────────────────────
  engine:
    name: 内核 · Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['18.x', '20.x', '22.x', '24.x']

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 注意：这里没有 npm install，是故意的。
      - name: 引擎与模型测试（154 项断言，无任何依赖）
        run: npm run test:engine

      - name: 校验示例工程（发现问题退出码 2）
        run: node bin/ocb.js check examples/demo.ocb.json

      - name: 冒烟：导出各格式
        run: |
          node bin/ocb.js csv    examples/demo.ocb.json -o /tmp/out.csv
          node bin/ocb.js md     examples/demo.ocb.json -o /tmp/out.md
          node bin/ocb.js txt    examples/demo.ocb.json -o /tmp/out.txt
          node bin/ocb.js report examples/demo.ocb.json -o /tmp/out.html
          node -e "
            const fs = require('fs');
            const need = ['/tmp/out.csv','/tmp/out.md','/tmp/out.txt','/tmp/out.html'];
            for (const f of need) {
              const s = fs.statSync(f).size;
              if (s < 200) { console.error('产物过小，疑似失败: ' + f + ' (' + s + ' 字节)'); process.exit(1); }
              console.log('  ' + f + '  ' + s + ' 字节');
            }
            const csv = fs.readFileSync('/tmp/out.csv');
            if (!(csv[0] === 0xEF && csv[1] === 0xBB && csv[2] === 0xBF)) {
              console.error('CSV 缺少 UTF-8 BOM，Excel 会乱码'); process.exit(1);
            }
            console.log('  CSV BOM 正确');
          "

  # ─────────────────────────────────────────────────────────────
  # 界面：用 jsdom 在无头环境里真实初始化整页并点一遍。
  # jsdom 30 的 engines 是 `^22.22.2 || ^24.15.0 || >=26.0.0`，
  # 所以这一格只跑 jsdom 支持的 Node —— 与内核矩阵分开是为了不误报。
  # ─────────────────────────────────────────────────────────────
  ui:
    name: 界面 · Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 不启用 setup-node 的 cache：本项目不提交 package-lock.json，
      # 启用 cache 会因找不到 lockfile 直接失败。
      - name: 安装开发依赖（仅 jsdom，运行时仍是零依赖）
        run: npm install --no-audit --no-fund

      - name: 界面冒烟测试（jsdom，64 项断言）
        run: npm run test:ui
